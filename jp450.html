const DATA = [{"n": 1, "part": 1, "jp": "空港・入国", "ko": "공항 도착 · 입국심사", "s": [{"jp": "観光で来ました。三日間滞在する予定です。", "ko": "관광으로 왔습니다. 3일간 머물 예정입니다."}, {"jp": "すみません、この荷物を預けたいんですが。", "ko": "실례합니다, 이 짐을 맡기고 싶은데요."}, {"jp": "空港から市内まで、どうやって行けばいいですか。", "ko": "공항에서 시내까지 어떻게 가면 되나요?"}, {"jp": "電車とバスと、どちらのほうが早いですか。", "ko": "전철과 버스 중에 어느 쪽이 더 빠른가요?"}, {"jp": "この近くに両替できるところはありますか。", "ko": "이 근처에 환전할 수 있는 곳이 있나요?"}]}, {"n": 2, "part": 1, "jp": "きっぷ・ICカード", "ko": "표 사기 · 충전 · 개찰구", "s": [{"jp": "新宿までの切符を二枚お願いします。", "ko": "신주쿠까지 가는 표 두 장 주세요."}, {"jp": "券売機の使い方を教えてもらえますか。", "ko": "발매기 사용법을 알려주실 수 있나요?"}, {"jp": "このカードにチャージしたいんですけど、いくらからできますか。", "ko": "이 카드를 충전하고 싶은데, 얼마부터 되나요?"}, {"jp": "特急券も買わなければいけませんか。", "ko": "특급권도 사야 하나요?"}, {"jp": "切符をなくしてしまったんですが、どうしたらいいですか。", "ko": "표를 잃어버렸는데, 어떻게 하면 되나요?"}]}, {"n": 3, "part": 1, "jp": "電車・乗り換え", "ko": "노선 확인 · 환승", "s": [{"jp": "この電車は渋谷に止まりますか。", "ko": "이 전철은 시부야에 서나요?"}, {"jp": "次の駅で急行に乗り換えたほうがいいですか。", "ko": "다음 역에서 급행으로 갈아타는 게 나을까요?"}, {"jp": "何番線から出ますか。", "ko": "몇 번 승강장에서 출발하나요?"}, {"jp": "終電は何時までですか。", "ko": "막차는 몇 시까지인가요?"}, {"jp": "乗り換えに何分ぐらいかかりますか。", "ko": "환승하는 데 몇 분쯤 걸리나요?"}]}, {"n": 4, "part": 1, "jp": "道を聞く", "ko": "길 묻기 · 방향", "s": [{"jp": "すみません、この住所はどのあたりですか。", "ko": "실례합니다, 이 주소는 어느 쯤인가요?"}, {"jp": "ここから歩いて行けますか。", "ko": "여기서 걸어서 갈 수 있나요?"}, {"jp": "まっすぐ行って、二つ目の角を右に曲がってください。", "ko": "쭉 가서 두 번째 모퉁이에서 오른쪽으로 도세요."}, {"jp": "この道で合っていますか。", "ko": "이 길이 맞나요?"}, {"jp": "近くに目印になるものはありますか。", "ko": "근처에 표시가 될 만한 게 있나요?"}]}, {"n": 5, "part": 1, "jp": "バス・タクシー", "ko": "목적지 전달 · 요금", "s": [{"jp": "東京駅の八重洲口までお願いします。", "ko": "도쿄역 야에스 출구까지 가주세요."}, {"jp": "トランクを開けてもらえますか。", "ko": "트렁크를 열어주실 수 있나요?"}, {"jp": "次の信号で止めてください。", "ko": "다음 신호에서 세워주세요."}, {"jp": "このバスは博物館の前を通りますか。", "ko": "이 버스는 박물관 앞을 지나가나요?"}, {"jp": "現金しか使えませんか。", "ko": "현금만 되나요?"}]}, {"n": 6, "part": 1, "jp": "チェックイン", "ko": "호텔 체크인", "s": [{"jp": "ネットで予約したキムです。", "ko": "인터넷으로 예약한 김입니다."}, {"jp": "早めにチェックインできますか。", "ko": "조금 일찍 체크인할 수 있나요?"}, {"jp": "荷物を先に預かってもらえますか。", "ko": "짐을 먼저 , "ko": "옆집으로 이사 온 김입니다."}, {"jp": "これ、よかったらどうぞ。", "ko": "이거, 괜찮으시면 받으세요."}, {"jp": "少しうるさかったらすみません。", "ko": "조금 시끄러우면 죄송해요."}, {"jp": "町内会には入ったほうがいいですか。", "ko": "반상회에는 가입하는 게 좋을까요?"}, {"jp": "これからよろしくお願いします。", "ko": "앞으로 잘 부탁드립니다."}]}, {"n": 39, "part": 2, "jp": "スーパー", "ko": "장보기 · 계산대", "s": [{"jp": "これはどこの産ですか。", "ko": "이건 어디 산인가요?"}, {"jp": "賞味期限はいつまでですか。", "ko": "유통기한은 언제까지인가요?"}, {"jp": "ポイントカードは作れますか。", "ko": "포인트 카드는 만들 수 있나요?"}, {"jp": "五時を過ぎると安くなりますか。", "ko": "5시가 지나면 싸지나요?"}, {"jp": "卵は割れないように入れてください。", "ko": "달걀은 깨지지 않게 넣어주세요."}]}, {"n": 40, "part": 2, "jp": "料理・レシピ", "ko": "조리 순서", "s": [{"jp": "材料を全部切っておきます。", "ko": "재료를 전부 미리 썰어둡니다."}, {"jp": "火が通ったら味をつけます。", "ko": "익으면 간을 합니다."}, {"jp": "弱火で十分ほど煮ます。", "ko": "약불로 10분 정도 끓입니다."}, {"jp": "味を見ながら塩を足します。", "ko": "간을 보면서 소금을 더합니다."}, {"jp": "冷めないうちに食べましょう。", "ko": "식기 전에 먹읍시다."}]}, {"n": 41, "part": 2, "jp": "掃除・洗濯", "ko": "집안일", "s": [{"jp": "洗濯物を干しておきました。", "ko": "빨래를 널어뒀어요."}, {"jp": "この服は手洗いですか。", "ko": "이 옷은 손세탁인가요?"}, {"jp": "掃除機をかけてから拭きます。", "ko": "청소기를 돌리고 나서 닦습니다."}, {"jp": "シャツにしみが付いてしまいました。", "ko": "셔츠에 얼룩이 생겨버렸어요."}, {"jp": "乾くまで置いておいてください。", "ko": "마를 때까지 놔둬 주세요."}]}, {"n": 42, "part": 2, "jp": "家のトラブル", "ko": "고장 · 수리 요청", "s": [{"jp": "水が漏れているみたいです。", "ko": "물이 새고 있는 것 같아요."}, {"jp": "電気が急に消えました。", "ko": "불이 갑자기 꺼졌어요."}, {"jp": "鍵をなくして中に入れません。", "ko": "열쇠를 잃어버려서 안에 못 들어가요."}, {"jp": "修理に来てもらえますか。", "ko": "수리하러 와주실 수 있나요?"}, {"jp": "費用はこちら持ちですか。", "ko": "비용은 저희 부담인가요?"}]}, {"n": 43, "part": 2, "jp": "宅配・再配達", "ko": "택배 수령 · 재배달", "s": [{"jp": "荷物を受け取れませんでした。", "ko": "택배를 못 받았어요."}, {"jp": "再配達をお願いしたいんですが。", "ko": "재배달을 부탁드리고 싶은데요."}, {"jp": "明日の午前中でお願いします。", "ko": "내일 오전 중으로 부탁드려요."}, {"jp": "置き配にしてもらえますか。", "ko": "문 앞에 놔두는 걸로 해주실 수 있나요?"}, {"jp": "不在票が入っていました。", "ko": "부재중 안내표가 들어 있었어요."}]}, {"n": 44, "part": 2, "jp": "病院の受付", "ko": "병원 접수", "s": [{"jp": "予約はしていないんですが、診てもらえますか。", "ko": "예약은 안 했는데, 진료받을 수 있나요?"}, {"jp": "保険証を持ってきました。", "ko": "보험증 가져왔어요."}, {"jp": "初めてなので問診票を書きます。", "ko": "처음이라서 문진표를 씁니다."}, {"jp": "待ち時間はどのくらいですか。", "ko": "대기 시간은 어느 정도인가요?"}, {"jp": "薬は近くの薬局でもらえますか。", "ko": "약은 근처 약국에서 받을 수 있나요?"}]}, {"n": 45, "part": 2, "jp": "症状を伝える", "ko": "증상 설명 · 경과", "s": [{"jp": "三日前から熱が下がりません。", "ko": "3일 전부터 열이 안 내려요."}, {"jp": "咳と鼻水がひどいです。", "ko": "기침과 콧물이 심해요."}, {"jp": "食欲があまりありません。", "ko": "식욕이 별로 없어요."}, {"jp": "薬を飲んでも良くなりません。", "ko": "약을 먹어도 나아지지 않아요."}, {"jp": "アレルギーはありません。", "ko": "알레르기는 없어요."}]}, {"n": 46, "part": 2, "jp": "薬局", "ko": "처방 · 복용법", "s": [{"jp": "処方せんはこちらです。", "ko": "처방전은 여기 있습니다."}, {"jp": "ジェネリックでもいいですか。", "ko": "제네릭이라도 괜찮나요?"}, {"jp": "食後に飲めばいいですか。", "ko": "식후에 먹으면 되나요?"}, {"jp": "お薬手帳は持っていません。", "ko": "약수첩은 가지고 있지 않아요."}, {"jp": "副作用はありますか。", "ko": "부작용은 있나요?"}]}, {"n": 47, "part": 2, "jp": "歯医者・健康診断", "ko": "치과 · 건강검진", "s": [{"jp": "奥歯が冷たいものでしみます。", "ko": "어금니가 찬 것에 시려요."}, {"jp": "虫歯かもしれません。", "ko": "충치일지도 몰라요."}, {"jp": "今日中に治療できますか。", "ko": "오늘 중으로 치료할 수 있나요?"}, {"jp": "健康診断の結果はいつ出ますか。", "ko": "건강검진 결과는 언제 나오나요?"}, {"jp": "次の予約を取っておきます。", "ko": "다음 예약을 잡아둘게요."}]}, {"n": 48, "part": 2, "jp": "美容院", "ko": "미용실 · 스타일 전달", "s": [{"jp": "全体的に短くしてください。", "ko": "전체적으로 짧게 해주세요."}, {"jp": "三センチくらい切ってください。", "ko": "3센티 정도 잘라주세요."}, {"jp": "前髪は眉が見えるくらいで。", "ko": "앞머리는 눈썹이 보일 정도로요."}, {"jp": "色は明るくしすぎないでください。", "ko": "색은 너무 밝게 하지 말아주세요."}, {"jp": "こんな感じにできますか。", "ko": "이런 느낌으로 될까요?"}]}, {"n": 49, "part": 2, "jp": "クリーニング", "ko": "세탁소 · 수선", "s": [{"jp": "仕上がりはいつになりますか。", "ko": "완성은 언제쯤 되나요?"}, {"jp": "しみ抜きもお願いできますか。", "ko": "얼룩 제거도 부탁드릴 수 있나요?"}, {"jp": "急ぎでお願いしたいんですが。", "ko": "급한 건으로 부탁드리고 싶은데요."}, {"jp": "ボタンが取れています。", "ko": "단추가 떨어져 있어요."}, {"jp": "引換券をなくしました。", "ko": "교환권을 잃어버렸어요."}]}, {"n": 50, "part": 2, "jp": "ジム・運動", "ko": "운동 습관 · 등록", "s": [{"jp": "見学だけでもいいですか。", "ko": "구경만 해도 될까요?"}, {"jp": "週に三回くらい通っています。", "ko": "일주일에 세 번 정도 다니고 있어요."}, {"jp": "体を動かすようにしています。", "ko": "몸을 움직이려고 하고 있어요."}, {"jp": "走れる距離が長くなりました。", "ko": "달릴 수 있는 거리가 길어졌어요."}, {"jp": "入会金はかかりますか。", "ko": "가입비는 드나요?"}]}, {"n": 51, "part": 2, "jp": " : "少し席を外します。", "ko": "잠시 자리를 비우겠습니다."}, {"jp": "何かあれば声をかけてください。", "ko": "무슨 일 있으면 불러주세요."}, {"jp": "すみません、少しよろしいですか。", "ko": "실례합니다, 잠깐 괜찮으실까요?"}]}, {"n": 58, "part": 2, "jp": "会議・報告", "ko": "보고 · 의견", "s": [{"jp": "進み具合をご報告します。", "ko": "진행 상황을 보고드리겠습니다."}, {"jp": "こちらの資料をご覧ください。", "ko": "이 자료를 봐주십시오."}, {"jp": "個人的にはこう思います。", "ko": "개인적으로는 이렇게 생각합니다."}, {"jp": "確認してからお返事します。", "ko": "확인하고 나서 답변드리겠습니다."}, {"jp": "期限を延ばしていただけませんか。", "ko": "기한을 연장해 주실 수 없을까요?"}]}, {"n": 59, "part": 2, "jp": "通勤・遅刻", "ko": "출퇴근 · 지각 연락", "s": [{"jp": "電車が止まっていて遅れそうです。", "ko": "전철이 멈춰서 늦을 것 같아요."}, {"jp": "十分ほど遅れます。", "ko": "10분 정도 늦겠습니다."}, {"jp": "定期券を買い直しました。", "ko": "정기권을 다시 샀어요."}, {"jp": "振替輸送を使いました。", "ko": "대체 운송을 이용했어요."}, {"jp": "着き次第連絡します。", "ko": "도착하는 대로 연락드리겠습니다."}]}, {"n": 60, "part": 2, "jp": "週末の予定", "ko": "약속 잡기", "s": [{"jp": "週末は何か予定がありますか。", "ko": "주말에 뭔가 계획 있어요?"}, {"jp": "天気がよければ出かけようと思っています。", "ko": "날씨가 좋으면 나가려고 해요."}, {"jp": "よかったら一緒にどうですか。", "ko": "괜찮으면 같이 어때요?"}, {"jp": "十時に駅で待ち合わせしましょう。", "ko": "10시에 역에서 만나요."}, {"jp": "楽しみにしています。", "ko": "기대하고 있을게요."}]}, {"n": 61, "part": 3, "jp": "あいさつと近況", "ko": "오랜만의 인사", "s": [{"jp": "お久しぶりです。お元気でしたか。", "ko": "오랜만이에요. 잘 지내셨어요?"}, {"jp": "最近どうですか。", "ko": "요즘 어떠세요?"}, {"jp": "相変わらず忙しいです。", "ko": "여전히 바빠요."}, {"jp": "あっという間に一年が過ぎました。", "ko": "눈 깜짝할 사이에 1년이 지났네요."}, {"jp": "変わりないですか。", "ko": "별일 없으시죠?"}]}, {"n": 62, "part": 3, "jp": "自己紹介", "ko": "자기소개 · 일 이야기", "s": [{"jp": "貿易の会社で働いています。", "ko": "무역 회사에서 일하고 있어요."}, {"jp": "日本に来て三年になります。", "ko": "일본에 온 지 3년 됐어요."}, {"jp": "主に営業を担当しています。", "ko": "주로 영업을 담당하고 있어요."}, {"jp": "日本語はまだまだです。", "ko": "일본어는 아직 멀었어요."}, {"jp": "気軽に呼んでください。", "ko": "편하게 불러주세요."}]}, {"n": 63, "part": 3, "jp": "出身・家族", "ko": "고향 · 가족", "s": [{"jp": "ソウルの近くの出身です。", "ko": "서울 근처 출신이에요."}, {"jp": "兄弟は姉が一人います。", "ko": "형제는 언니가 한 명 있어요."}, {"jp": "両親は韓国に住んでいます。", "ko": "부모님은 한국에 살고 계세요."}, {"jp": "家族とは月に一度話します。", "ko": "가족과는 한 달에 한 번 통화해요."}, {"jp": "実家には年に二回帰ります。", "ko": "본가에는 1년에 두 번 가요."}]}, {"n": 64, "part": 3, "jp": "趣味の話", "ko": "취미 · 관심사", "s": [{"jp": "休みの日は何をしていますか。", "ko": "쉬는 날엔 뭐 하세요?"}, {"jp": "最近は写真にはまっています。", "ko": "요즘은 사진에 빠져 있어요."}, {"jp": "上手ではないですが、好きです。", "ko": "잘하지는 못하지만 좋아해요."}, {"jp": "一人でぶらぶらするのが好きです。", "ko": "혼자 어슬렁거리는 걸 좋아해요."}, {"jp": "いつか習ってみたいです。", "ko": "언젠가 배워보고 싶어요."}]}, {"n": 65, "part": 3, "jp": "相づち", "ko": "맞장구 · 리액션", "s": [{"jp": "そうなんですね。", "ko": "그렇군요."}, {"jp": "へえ、知らなかったです。", "ko": "와, 몰랐어요."}, {"jp": "それは大変でしたね。", "ko": "그거 힘드셨겠네요."}, {"jp": "わかります、わかります。", "ko": "알아요, 알아요."}, {"jp": "なるほど、そういうことですか。", "ko": "그렇구나, 그런 거였군요."}]}, {"n": 66, "part": 3, "jp": "質問を広げる", "ko": "대화 잇는 질문", "s": [{"jp": "それってどういう意味ですか。", "ko": "그게 무슨 뜻이에요?"}, {"jp": "たとえばどんなことですか。", "ko": "예를 들면 어떤 건가요?"}, {"jp": "その後どうなったんですか。", "ko": "그 뒤에 어떻게 됐어요?"}, {"jp": "ちなみに、どのくらい続けているんですか。", "ko": "참고로, 얼마나 계속하고 계세요?"}, {"jp": "もう少し詳しく聞いてもいいですか。", "ko": "조금 더 자세히 여쭤봐도 될까요?"}]}, {"n": 67, "part": 3, "jp": "ほめる", "ko": "칭찬하기 · 받아넘기기", "s": [{"jp": "日本語、お上手ですね。", "ko": "일본어 잘하시네요."}, {"jp": "さすがですね。", "ko": "역시 대단하시네요."}, {"jp": "そんなことないです。", "ko": "그렇지 않아요."}, {"jp": "センスがいいですね。", "ko": "센스가 좋으시네요."}, {"jp": "まねしたいくらいです。", "ko": "따라 하고 싶을 정도예요."}]}, {"n": 68, "part": 3, "jp": "お礼", "ko": "감사 · 송구함", "s": [{"jp": "わざわざありがとうございます。", "ko": "일부러 감사합니다."}, {"jp": "手伝っていただいて助かりました。", "ko": "도와주셔서 큰 도움이 됐어요."}, {"jp": "おかげさまでうまくいきました。", "ko": "덕분에 잘 됐어요."}, {"jp": "こちらこそありがとうございます。", "ko": "저야말로 감사합니다."}, {"jp": "何かお返しをさせてください。", "ko": "뭔가 보답하게 해주세요."}]}, {"n": 69, "part": 3, "jp": "謝る", "ko": "사과 · 사정 설명", "s": [{"jp": "遅くなって申し訳ありません。", "ko": "늦어서 죄송합니다."}, {"jp": "私の勘違いでした。", "ko": "제가 착각했어요."}, {"jp": "次から気をつけます。", "ko": "다음부터 조심하겠습니다."}, {"jp": "ご迷惑をおかけしました。", "ko": "폐를 끼쳤습니다."}, {"jp": "そんなつもりじゃなかったんです。", "ko": "그럴 의도는 아니었어요."}]}, {"n": 70, "part": 3, "jp": "誘う", "ko": "권유 · 제안", "s": [{"jp": "今度、ごはんでもどうですか。", "ko": "다음에 밥이라도 어때요?"}, {"jp": "もしよかったら一緒に行きませんか。", "ko": "괜찮으시면 같이 안 가실래요?"}, {"jp": "都合のいい日はありますか。", "ko": "편한 날 있으세요?"}, {"jp": "無理しなくても大丈夫ですよ。", "ko": "무리하지 않으셔도 괜찮아요."}, {"jp": "じゃあ、決まりですね。", "ko": "그럼 정해진 걸로 하죠."}]}, {"n": 71, "part": 3, "jp": "断る", "ko": "완곡한 거절", "s": [{"jp": "せっかくですが、その日は難しいです。", "ko": "모처럼인데, 그날은 어려울 것 같아요."}, {"jp": "あいにく先約がありまして。", "ko": "공교롭게도 선약이 있어서요."}, {"jp": "また誘ってください。", "ko": "또 불러주세요."}, {"jp": "ちょっと考えさせてください。", "ko": "조금 생각할 시간을 주세요."}, {"jp": "気持ちだけいただきます。", "ko": "마음만 받을게요."}]}, {"n": 72, "part": 3, "jp": "約束・待ち合わせ", "ko": "약속 정하기", "s": [{"jp": "何時にどこで会いましょうか。", "ko": "몇 시에 어디서 만날까요?"}, {"jp": "駅の改札を出たところで。", "ko": "역 개찰구 나온 데서요."}, {"jp": "少し遅れるかもしれません。", "ko": "조금 늦을지도 몰라요."}, {"jp": "着いたら連絡します。", "ko": "도착하면 연락할게요."}, {"jp": "先に入っていてください。", "ko": "먼저 들어가 계세요."}]}, {"n": 73, "part": 3, "jp": "好き嫌い", "ko": "취향 말하기", "s": [{"jp": "甘いものには目がないんです。", "ko": "단 건 사족을 못 써요."}, {"jp": "辛いのはちょっと苦手です。", "ko": "매운 건 좀 잘 못 먹어요."}, {"jp": "どちらかというと静かな方が好きです。", "ko": "굳이 따지자면 조용한 쪽이 좋아요."}, {"jp": "食べられないものはありません。", "ko": "못 먹는 건 없어요."}, {"jp": "好みが合いますね。", "ko": "취향이 잘 맞네요."}]}, {"n": 74, "part": 3, "jp": "意見を言う", "ko": "의견 꺼내기", "s": [{"jp": "私はこう思うんですけど。", "ko": "저는 이렇게 생각하는데요."}, {"jp": "たしかにそうかもしれませんね。", "ko": "확실히 그럴지도 모르겠네요."}, {"jp": "一つ気になることがあります。", "ko": "한 가지 걸리는 게 있어요."}, {"jp": "うまく言えないんですが。", "ko": "잘 설명이 안 되는데요."}, {"jp": "どう思いますか。", "ko": "어떻게 생각하세요?"}]}, {"n": 75, "part": 3, "jp": "賛成・反対", "ko": "동의 · 이견", "s": [{"jp": "その意見に賛成です。", "ko": "그 의견에 찬성이에요."}, {"jp": "おっしゃる通りだと思います。", "ko": "말씀하신 대로라고 생각해요."}, {"jp": "それはそうなんですが。", "ko": "그건 그렇습니다만."}, {"jp": "別のやり方もあると思います。", "ko": "다른 방법도 있을 것 같아요."}, {"jp": "反対というわけではありません。", "ko": "반대한다는 건 아니에요."}]}, {"n": 76, "part": 3, "jp": "提案する", "ko": "제안 · 대안", "s": [{"jp": "こうしてみたらどうでしょうか。", "ko": "이렇게 해보면 어떨까요?"}, {"jp": "一度試してみる価値はあります。", "ko": "한번 시도해 볼 가치는 있어요."}, {"jp": "その代わりに時間がかかります。", "ko": "그 대신 시간이 걸려요."}, {"jp": "どちらでもいいと思います。", "ko": "어느 쪽이든 괜찮을 것 같아요."}, {"jp": "決めるのは早いほうがいいですね。", "ko": "정하는 건 빠른 게 좋겠네요."}]}, {"n": 77, "part": 3, "jp": "相談する", "ko": "고민 상담", "s": [{"jp": "ちょっと相談してもいいですか。", "ko": "잠깐 상담해도 될까요?"}, {"jp": "どうすればいいか迷っています。", "ko": "어떻게 해야 할지 고민이에요."}, {"jp": "経験者の意見が聞きたいです。", "ko": "경험자의 의견을 듣고 싶어요."}, {"jp": "正直、自信がありません。", "ko": "솔직히 자신이 없어요."}, {"jp": "話したら少し楽になりました。", "ko": "이야기하니까 좀 편해졌어요."}]}, {"n": 78, "part": 3, "jp": "経験を話す", "ko": "경험 · 시절 이야기", "s": [{"jp": "一度だけ行ったことがあります。", "ko": "딱 한 번 가본 적이 있어요."}, {"jp": "学生のころはよく通っていました。", "ko": "학생 때는 자주 다녔어요."}, {"jp": "あのときは何も知らなかったんです。", "ko": "그땐 아무것도 몰랐어요."}, {"jp": "やってみると意外と簡単でした。", "ko": "해보니까 의외로 간단했어요."}, {"jp": "あの経験があってよかったです。", "ko": "그 경험이 있어서 다행이에요."}]}, {"n": 79, "part": 3, "jp": "失敗談", "ko": "실수담 · 웃음", "s": [{"jp": "電車を乗り過ごしちゃって。", "ko": "전철을 지나쳐 버려서요."}, {"jp": "財布を忘れたまま出かけました。", "ko": "지갑을 두고 온 채로 나갔어요."}, {"jp": "あのときは本当に焦りました。", "ko": "그땐 정말 당황했어요."}, {"jp": "確認しておけばよかったです。", "ko": "확인해 둘 걸 그랬어요."}, {"jp": "今では笑い話です。", "ko": "지금은 웃음거리죠."}]}, {"n": 80, "part": 3, "jp": "うわさ・伝聞", "ko": "들은 이야기 전하기", "s": [{"jp": "来月から変わるらしいですよ。", "ko": "다음 달부터 바뀐대요."}, {"jp": "田中さんがそう言ってました。", "ko": "다나카 씨가 그렇게 말했어요."}, {"jp": "うわさでは、けっこう人気だそうです。", "ko": "소문으로는 꽤 인기 있대요."}, {"jp": "本当かどうかわかりませんが。", "ko": "사실인지 아닌지는 모르겠지만요."}, {"jp": "誰から聞いたんですか。", "ko": "누구한테 들으셨어요?"}]}, {"n": 81, "part": 3, "jp": "推測・あいまい", "ko": "단정 피하기", "s": [{"jp": "たぶん大丈夫じゃないかな。", "ko": "아마 괜찮지 않을까."}, {"jp": "そんな気がします。", "ko": "그런 느낌이 들어요."}, {"jp": "はっきりとは言えませんが。", "ko": "확실하게는 말 못 하겠지만요."}, {"jp": "場合によりますね。", "ko": "경우에 따라 다르죠."}, {"jp": "まあ、そんなところです。", "ko": "뭐, 그런 셈이죠."}]}, {"n": 82, "part": 3, "jp": "感情を伝える", "ko": "감정 표현", "s": [{"jp": "すごくうれしかったです。", "ko": "정말 기뻤어요."}, {"jp": "ちょっとがっかりしました。", "ko": "좀 실망했어요."}, {"jp": "思ったよりよかったです。", "ko": "생각보다 좋았어요."}, {"jp": "悔しくて眠れませんでした。", "ko": "분해서 잠이 안 왔어요."}, {"jp": "ほっとしました。", "ko": "안심했어요."}]}, {"n": 83, "part": 3, "jp": "心配・励ます", "ko": "걱정 · 격려", "s": [{"jp": "無理しないでくださいね。", "ko": "무리하지 마세요."}, {"jp": "何かあったら言ってくださいね。", "ko": "무슨 일 있으면 말해주세요."}, {"jp": "きっとうまくいきますよ。", "ko": "분명 잘될 거예요."}, {"jp": "気にしないでください。", "ko": "신경 쓰지 마세요."}, {"jp": "ゆっくり休んでください。", "ko": "푹 쉬세요."}]}, {"n": 84, o": "건강하세요."}]}];
let cur = 0, voice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices().filter(v => (v.lang||'').toLowerCase().startsWith('ja'));
  if (!vs.length) return null;
  const male = vs.find(v => /otoya|ichiro|hattori|male|男/i.test(v.name));
  return male || vs.find(v => /google/i.test(v.name)) || vs[0];
}
speechSynthesis.onvoiceschanged = () => { voice = pickVoice(); };
voice = pickVoice();
function speak(text, cb){
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP'; u.rate = parseFloat(document.getElementById('rate').value);
  if (!voice) voice = pickVoice();
  if (voice) u.voice = voice;
  if (cb) u.onend = cb;
  speechSynthesis.speak(u);
}
function render(){
  const d = DATA[cur];
  document.getElementById('dnum').textContent = 'Day ' + String(d.n).padStart(2,'0');
  document.getElementById('tjp').textContent = d.jp;
  document.getElementById('tko').textContent = d.ko;
  document.getElementById('pick').value = cur;
  const list = document.getElementById('list');
  list.innerHTML = '';
  d.s.forEach((s, i) => {
    const c = document.createElement('div'); c.className = 'card'; c.id = 'c' + i;
    c.innerHTML = '<div class="cn"><span class="pn">' + (i+1) + '</span><span class="ktext">' + s.ko + '</span></div>'
      + '<div class="jtext hidden" id="j' + i + '">' + s.jp + '</div>'
      + '<div class="acts"><button data-r="' + i + '">일본어 보기</button>'
      + '<button class="primary" data-p="' + i + '">듣기</button></div>';
    list.appendChild(c);
  });
  list.onclick = e => {
    const r = e.target.dataset.r, p = e.target.dataset.p;
    if (r !== undefined){ document.getElementById('j'+r).classList.toggle('hidden');
      e.target.textContent = document.getElementById('j'+r).classList.contains('hidden') ? '일본어 보기' : '일본어 가리기'; }
    if (p !== undefined){ mark(p); speak(DATA[cur].s[p].jp); }
  };
  window.scrollTo(0,0);
}
function mark(i){ document.querySelectorAll('.card').forEach(c => c.classList.remove('on'));
  if (i !== null && i !== undefined) document.getElementById('c'+i).classList.add('on'); }
function playAll(i){
  if (i >= DATA[cur].s.length){ mark(null); return; }
  mark(i); speak(DATA[cur].s[i].jp, () => setTimeout(() => playAll(i+1), 500));
}
document.getElementById('playAll').onclick = () => playAll(0);
document.getElementById('prev').onclick = () => { if (cur > 0){ cur--; speechSynthesis.cancel(); render(); } };
document.getElementById('next').onclick = () => { if (cur < DATA.length-1){ cur++; speechSynthesis.cancel(); render(); } };
const pick = document.getElementById('pick');
DATA.forEach((d,i) => { const o = document.createElement('option'); o.value = i;
  o.textContent = 'Day ' + String(d.n).padStart(2,'0') + ' · ' + d.jp; pick.appendChild(o); });
pick.onchange = e => { cur = +e.target.value; speechSynthesis.cancel(); render(); };
const h = location.hash.match(/day(\d+)/i);
if (h){ const idx = DATA.findIndex(d => d.n === +h[1]); if (idx >= 0) cur = idx; }
render();
</script></body></html>
